controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    # Based on the URDF, we have many continuous joints.
    # Assuming a 6-wheel diff drive for a rover.
    left_wheel_names: ["Revolute 29", "Revolute 30", "Revolute 31"] 
    right_wheel_names: ["Revolute 36", "Revolute 37", "Revolute 38"]

    wheel_separation: 0.35
    wheel_radius: 0.05
    
    use_stamped_vel: false

    publish_rate: 50.0
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    publish_odom: true
    publish_odom_tf: true
    publish_wheel_tf: false
