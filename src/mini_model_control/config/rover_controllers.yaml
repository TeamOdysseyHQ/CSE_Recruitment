controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rover_drive_controller:
      type: diff_drive_controller/DiffDriveController

rover_drive_controller:
  ros__parameters:
    # Left-side wheel joints: front=Revolute_29, mid=Revolute_30, rear=Revolute_31
    left_wheel_names:
      - "Revolute_29"
      - "Revolute_30"
      - "Revolute_31"

    # Right-side wheel joints: front=Revolute_36, mid=Revolute_37, rear=Revolute_38
    right_wheel_names:
      - "Revolute_36"
      - "Revolute_37"
      - "Revolute_38"

    # Revolute_25 is at z=+0.25 from base_link, Revolute_32 at z=-0.25
    # After the rpy fix that Z gap becomes lateral Y gap → separation = 0.50 m
    wheel_separation: 0.50

    # Wheel cylinder CoM z-offset from inertia block = 0.05013 → radius ≈ 0.10 m
    wheel_radius: 0.10

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        min_velocity: -1.5
        has_acceleration_limits: true
        max_acceleration: 1.5